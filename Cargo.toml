[package]
name = "githits-scan"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "Generate SBOMs, audit dependencies, and check licenses from a repository's lockfiles with the GitHits public API"
license = "Apache-2.0"
repository = "https://github.com/githits-com/githits-scan"
homepage = "https://githits.com"
readme = "README.md"
keywords = ["sbom", "cyclonedx", "spdx", "lockfile", "dependencies"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["xtask/", ".agents/", ".cargo/", ".github/", ".config/", "docs/", "changes/", "scripts/", "orca.yaml", ".pre-commit-config.yaml", ".gitleaks.toml", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md"]

[lib]
name = "githits_scan"
path = "src/lib.rs"

[[bin]]
name = "githits-scan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
globset = "0.4"
ignore = "0.4"
httpdate = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
spdx = { version = "0.13", default-features = false, features = ["std"] }
thiserror = "2.0"
toml_edit = { version = "0.25", features = ["serde"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true

# A root package that is also the workspace root: every future member inherits
# the same lint floor through `[lints] workspace = true`.
[workspace]
members = [".", "xtask"]

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
expect_used = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
