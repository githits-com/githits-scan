# cargo-deny is the repository's policy gate for dependency advisories,
# licenses, duplicate versions, and package sources. Keep exceptions exact and
# explain their reachability and removal condition next to the exception.

[graph]
# Evaluate optional dependency paths as soon as features are introduced.
all-features = true

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------

[licenses]
# Empirical allow-list for the locked dependency graph of a permissively
# licensed, publishable CLI. Add an entry only when a locked dependency needs
# it and record which dependency introduces it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # subtle and aws-lc-sys (TLS stack behind reqwest's rustls feature).
    "BSD-3-Clause",
    # webpki-roots (Mozilla's CA bundle behind reqwest's rustls feature).
    "CDLA-Permissive-2.0",
    # aws-lc-rs, rustls-webpki, and untrusted (TLS stack behind reqwest).
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

# ---------------------------------------------------------------------------
# Duplicate and wildcard dependencies
# ---------------------------------------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []

# ---------------------------------------------------------------------------
# Package sources
# ---------------------------------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies require an explicit, reviewed exception here.
allow-git = []
