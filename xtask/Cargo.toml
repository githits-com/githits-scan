[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
thiserror = "2.0"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
