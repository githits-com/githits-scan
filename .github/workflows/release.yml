name: Release

# Tagging is authorized after merged-SHA rehearsal; crates.io stays separate.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: "Require a complete release commit on main (no tag needed)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      release: ${{ steps.metadata.outputs.release }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Verify and resolve exact build metadata
        id: metadata
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          CANDIDATE: ${{ inputs.release_candidate }}
          # One target list drives builds and complete-asset verification.
          MATRIX: >-
            {"include":[
            {"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-24.04"},
            {"target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm"},
            {"target":"x86_64-apple-darwin","runner":"macos-15-intel"},
            {"target":"aarch64-apple-darwin","runner":"macos-15"},
            {"target":"x86_64-pc-windows-msvc","runner":"windows-2025"}]}
        run: |
          set -euo pipefail
          release=false
          if [ "${EVENT}" = "push" ]; then
            cargo xtask release verify-tag --tag "${TAG}"
            release=true
          elif [ "${CANDIDATE}" = "true" ]; then
            cargo xtask release verify-main
            release=true
          else
            cargo xtask release audit
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$(cargo xtask release version)"
            echo "release=${release}"
            echo "matrix=$(printf '%s' "${MATRIX}" | jq -c .)"
          } >> "${GITHUB_OUTPUT}"

  ci:
    name: Release CI
    needs: verify
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support GitHub's $/ syntax
    with:
      ref: ${{ needs.verify.outputs.sha }}
      release: ${{ needs.verify.outputs.release == 'true' }}

  live:
    name: Live API tests
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Exercise the real API with the exact release commit
        env:
          GITHITS_API_TOKEN: ${{ secrets.GITHITS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITHITS_API_TOKEN}" ]; then
            echo 'Configure the GITHITS_API_TOKEN repository secret before release rehearsal.' >&2
            exit 1
          fi
          cargo test --release --locked -p githits-scan --test live -- --ignored

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Build application
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p githits-scan --target "${TARGET}"
      - name: Package and exercise extracted binary
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="githits-scan-v${VERSION}-${TARGET}"
          mkdir -p "dist/${name}" extracted
          cp README.md LICENSE "dist/${name}/"
          binary=githits-scan
          if [ "${RUNNER_OS}" = "Windows" ]; then
            binary=githits-scan.exe
            cp "target/${TARGET}/release/${binary}" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" >/dev/null)
            archive="${name}.zip"
            7z x "dist/${archive}" -oextracted >/dev/null
          else
            cp "target/${TARGET}/release/${binary}" "dist/${name}/"
            archive="${name}.tar.gz"
            tar -czf "dist/${archive}" -C dist "${name}"
            tar -xzf "dist/${archive}" -C extracted
          fi
          cmp README.md "extracted/${name}/README.md"
          cmp LICENSE "extracted/${name}/LICENSE"
          test "$("extracted/${name}/${binary}" --version)" = "githits-scan ${VERSION}"
          fixture="${RUNNER_TEMP}/offline-detect"
          mkdir -p "${fixture}"
          printf 'version = 4\n' > "${fixture}/Cargo.lock"
          "extracted/${name}/${binary}" detect "${fixture}"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${archive}" > "${archive}.sha256" && sha256sum --check "${archive}.sha256")
          else
            (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256" && shasum -a 256 --check "${archive}.sha256")
          fi
          rm -r "dist/${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  assets:
    name: Verify release assets and notes
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify complete asset set and render reviewed notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          MATRIX: ${{ needs.verify.outputs.matrix }}
          RELEASE_MODE: ${{ needs.verify.outputs.release }}
        run: |
          set -euo pipefail
          printf '%s' "${MATRIX}" | jq -r '.include[].target' | while read -r target; do
            extension=tar.gz
            if [[ "${target}" == *windows* ]]; then extension=zip; fi
            echo "githits-scan-v${VERSION}-${target}.${extension}"
          done | sort > expected
          (cd dist && cat -- *.sha256 > SHA256SUMS && sha256sum --check --strict SHA256SUMS && rm -- *.sha256)
          echo SHA256SUMS >> expected
          sort -o expected expected
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > actual
          diff -u expected actual
          if [ "${RELEASE_MODE}" = "true" ]; then
            cargo xtask release notes > release-notes.md
          else
            cargo xtask release notes --unreleased > release-notes.md
          fi
          test -s release-notes.md || { echo "No pending fragments; use release_candidate=true for a release commit." >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [verify, ci, live, build, assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "githits-scan v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag dist/*
