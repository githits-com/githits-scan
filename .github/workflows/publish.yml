name: Publish to crates.io

# Publishing is a deliberate, human-triggered step: dispatch this workflow
# for an existing release tag. It never runs automatically. Authentication
# uses crates.io trusted publishing, so the crate must be configured on
# crates.io to trust this repository and workflow (see
# docs/implementation/release-process.md).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z); must already exist"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      # Trusted publishing: crates.io issues a short-lived token for this
      # workflow's OIDC identity; no long-lived registry token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Verify actual release tag, notes, and main membership
        env:
          TAG: ${{ inputs.tag }}
        run: cargo xtask release verify-tag --tag "${TAG}"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p githits-scan
